kind = "web"
previewPath = "/"
title = "Confinement Desk Coach"
version = "1.0.0"
id = "artifacts/cdc-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22471

[services.development]
run = "pnpm --filter @workspace/cdc-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cdc-coach", "run", "build" ]
publicDir = "artifacts/cdc-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22471"
BASE_PATH = "/"
